name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Import in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest .\HPWinPEDrivers.psd1 | Out-Null
          Import-Module .\HPWinPEDrivers.psd1 -Force
          Get-Command -Module HPWinPEDrivers | Format-Table -AutoSize

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -MinimumVersion 5.6.1 -MaximumVersion 6.99.99 -Scope CurrentUser -Force -SkipPublisherCheck
          $result = Invoke-Pester -Path .\Tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0) {
              throw "Pester failed: $($result.FailedCount) failed tests, $($result.FailedContainersCount) failed containers."
          }

      - name: Validate Gallery package staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = .\build.ps1
          $build | Format-List
          Test-ModuleManifest .\out\HPWinPEDrivers\HPWinPEDrivers.psd1 | Out-Null
          Import-Module .\out\HPWinPEDrivers\HPWinPEDrivers.psd1 -Force

  live-hp-smoke-test:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Discover and validate current HP WinPE pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\HPWinPEDrivers.psd1 -Force

          $pack = Get-HPWinPEDriverPackInfo
          $pack | Format-List *

          $manifestPath = Join-Path $env:RUNNER_TEMP 'HPWinPE.Manifest.json'
          $manifest = New-HPWinPEManifest -Path $manifestPath -Validate
          $manifest.Validation | Format-List

      - name: Upload live manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HPWinPE-Manifest
          path: ${{ runner.temp }}/HPWinPE.Manifest.json
          if-no-files-found: warn
